name: Build FinanceQ Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Susun Struktur Proyek Android
        run: |
          if [ -f "app.build.gradle" ] && [ ! -d "app/src/main" ]; then
            for f in AndroidManifest.xml MainActivity.java index.html; do
              if [ ! -f "$f" ]; then
                echo "ERROR: File wajib '$f' tidak ditemukan di root repositori!"
                exit 1
              fi
            done

            mkdir -p app/src/main/java/com/financeq/app
            mkdir -p app/src/main/assets
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/mipmap-xxxhdpi

            mv app.build.gradle app/build.gradle
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
            mv MainActivity.java app/src/main/java/com/financeq/app/MainActivity.java
            mv index.html app/src/main/assets/index.html
            [ -f "strings.xml" ] && mv strings.xml app/src/main/res/values/strings.xml

            if [ -f "icon.png" ]; then
              cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
              rm -f icon.png
            fi
          fi

          # Buat settings.gradle jika belum ada
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FinanceQ"
          include ':app'
          EOF
          fi

          # Buat root build.gradle jika belum ada (dan app/build.gradle tidak mencantumkan versi AGP)
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            if ! grep -Eq "com\.android\.application.*version" app/build.gradle; then
              cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
            fi
          fi

          # Buat gradle.properties untuk AndroidX jika belum ada
          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanceQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
