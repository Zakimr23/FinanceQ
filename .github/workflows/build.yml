name: Build FinanceQ Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Susun Struktur Proyek Android
        run: |
          if [ -f "app.build.gradle" ] && [ ! -d "app/src/main" ]; then
            mkdir -p app/src/main/java/com/MyWallet/app
            mkdir -p app/src/main/assets
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/mipmap-xxxhdpi

            mv app.build.gradle app/build.gradle
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
            mv MainActivity.java app/src/main/java/com/financeq/app/MainActivity.java
            mv index.html app/src/main/assets/index.html
            [ -f "strings.xml" ] && mv strings.xml app/src/main/res/values/strings.xml
            if [ -f "icon.png" ]; then
              cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
              rm -f icon.png
            fi
          fi

      - name: Unduh Chart.js (agar grafik jalan offline di APK)
        run: |
          mkdir -p app/src/main/assets/libs
          curl -fsSL -o app/src/main/assets/libs/chart.umd.min.js https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js || echo "Gagal unduh Chart.js, grafik akan memakai CDN"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanceQ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
