    function getRelativeDate(daysOffset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function addMonthsToDateStr(dateStr, months, anchorDay) {
      const [y, m, d0] = dateStr.split('-').map(Number);
      const lastDay = new Date(y, m - 1 + months + 1, 0).getDate();
      const dt = new Date(y, m - 1 + months, Math.min(anchorDay || d0, lastDay));
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function addDaysToDateStr(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

          return seed;

          wallets: Array.isArray(parsed.wallets) && parsed.wallets.length ? parsed.wallets : getDefaultSeedData().wallets,

      } catch (e) {

        try {

          if (rawBroken) localStorage.setItem(STORAGE_KEY + '_corrupt_backup', rawBroken);
        } catch (_) {}
        return getDefaultSeedData();

    // FEATURE 1 ENGINE: AUTOMATIC RECURRING TRANSACTIONS PROCESSOR
    // =========================================================================
    function processRecurringTransactions() {
      const today = getRelativeDate(0);
      let createdCount = 0;

      appState.recurring.forEach(rec => {
        if (!rec.active || !rec.nextDate) return;
        let safetyCounter = 0;
        while (rec.nextDate <= today && safetyCounter < 90) {
          appState.transactions.unshift({
            id: 'tx_rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            type: rec.type || 'expense',
            amount: Number(rec.amount),
            category: rec.category,
            walletId: rec.walletId,
            toWalletId: null,
            adminFee: 0,
            photo: null,
            isRecurringAuto: true,
            date: rec.nextDate,
            note: rec.note || rec.category
          });

          if (rec.frequency === 'daily') rec.nextDate = addDaysToDateStr(rec.nextDate, 1);
          else if (rec.frequency === 'weekly') rec.nextDate = addDaysToDateStr(rec.nextDate, 7);
          else {
            rec.anchorDay = rec.anchorDay || Number(rec.nextDate.slice(8, 10));
            rec.nextDate = addMonthsToDateStr(rec.nextDate, 1, rec.anchorDay);
          }

          createdCount++;
          safetyCounter++;
        }
      });

      if (createdCount > 0) {
        saveState();
        setTimeout(() => {
          showToast(`${createdCount} pencatatan berulang otomatis ditambahkan`);
        }, 500);
      }
    }

    function getSavingsUsageStatus() {
      const walletBalances = getWalletBalances();
      const totalWalletBalance = Object.values(walletBalances).reduce((s, v) => s + v, 0);
      const totalGoalsSaved = appState.goals.reduce((s, g) => s + Number(g.saved || 0), 0);
      const totalSavings = Math.max(0, totalWalletBalance) + totalGoalsSaved;

      const monthTxs = filterByPeriod(appState.transactions, 'month');
      const monthExpense = monthTxs
        .filter(t => t.type === 'expense')
        .reduce((s, t) => s + Number(t.amount), 0) +
        monthTxs
        .filter(t => t.type === 'transfer' && Number(t.adminFee) > 0)
        .reduce((s, t) => s + Number(t.adminFee), 0);

      const initialSavingsBase = totalSavings + monthExpense;
      const pctOfCurrentSavings = totalSavings > 0 ? (monthExpense / totalSavings) * 100 : (monthExpense > 0 ? 100 : 0);
      const pctOfInitialSavings = initialSavingsBase > 0 ? (monthExpense / initialSavingsBase) * 100 : 0;
      const effectivePct = Math.max(pctOfCurrentSavings, pctOfInitialSavings);

      return {
        isExceeded75: monthExpense > 0 && effectivePct > 75,
        effectivePct: Math.min(999, effectivePct),
        monthExpense,
        totalSavings,
        totalWalletBalance,
        totalGoalsSaved
      };
    }

    // Formatting Helpers
    function formatRupiah(amount, hide = false) {
      if (hide && appState.settings.hideBalance) return 'Rp •••••••';
      const isNegative = amount < 0;
      const formatted = new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(Math.abs(amount));
      return isNegative ? `-${formatted}` : formatted;
    }

    function formatShortRupiah(amount) {
      if (amount >= 1000000000) return `Rp ${(amount / 1000000000).toFixed(1)}M`;
      if (amount >= 1000000) return `Rp ${(amount / 1000000).toFixed(1)}jt`;
      if (amount >= 1000) return `Rp ${(amount / 1000).toFixed(0)}rb`;
      return `Rp ${amount}`;
    }

    function formatDateIndo(dateStr) {
      const today = getRelativeDate(0);
      const yesterday = getRelativeDate(-1);
      if (dateStr === today) return 'Hari Ini';
      if (dateStr === yesterday) return 'Kemarin';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dateObj = new Date(y, m - 1, d);
      return dateObj.toLocaleDateString(getLang() === 'en' ? 'en-GB' : 'id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Calculate live balance for each wallet (supports Transfer Admin Fee!)
    function getWalletBalances() {
      const balances = {};
      appState.wallets.forEach(w => {
        balances[w.id] = Number(w.initialBalance) || 0;
      });
      appState.transactions.forEach(tx => {
        const amt = Number(tx.amount) || 0;
        const admin = Number(tx.adminFee) || 0;
        if (tx.type === 'income') {
          if (balances[tx.walletId] !== undefined) balances[tx.walletId] += amt;
        } else if (tx.type === 'expense') {
          if (balances[tx.walletId] !== undefined) balances[tx.walletId] -= amt;
        } else if (tx.type === 'transfer') {
          // Source wallet decreases by transfer amount + admin fee
          if (balances[tx.walletId] !== undefined) balances[tx.walletId] -= (amt + admin);
          // Destination wallet receives exact transfer amount
          if (tx.toWalletId && balances[tx.toWalletId] !== undefined) balances[tx.toWalletId] += amt;
        }
      });
      return balances;
    }

    function filterByPeriod(transactions, period) {
      if (period === 'all') return transactions;
      const todayStr = getRelativeDate(0);
      const now = new Date();
      return transactions.filter(tx => {
        if (period === 'today') return tx.date === todayStr;
        const [y, m, d] = tx.date.split('-').map(Number);
        const txDate = new Date(y, m - 1, d);
        if (period === 'week') {
          const weekAgo = new Date();
          weekAgo.setDate(now.getDate() - 7);
          weekAgo.setHours(0, 0, 0, 0);
          return txDate >= weekAgo;
        }
        if (period === 'month') {
          return txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
        }
        if (period === '6months') {
          const sixMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 5, 1);
          return txDate >= sixMonthsAgo;
        }
        return true;
      });
    }

      appState.settings.darkMode = !appState.settings.darkMode;
      saveState();
      applyTheme();
      if (activeTab === 'analytics') renderAnalytics();
      if (activeTab === 'settings') renderSettings();
    }

    function toggleHideBalance() {
      appState.settings.hideBalance = !appState.settings.hideBalance;
      saveState();
      renderCurrentTab();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isCurrent = btn.dataset.tab === tab;
        btn.classList.toggle('text-emerald-600', isCurrent);
        btn.classList.toggle('dark:text-emerald-400', isCurrent);
        btn.classList.toggle('text-slate-400', !isCurrent);
        btn.classList.toggle('dark:text-slate-500', !isCurrent);
      });

      const settingsBtn = document.getElementById('btnTopSettings');
      if (tab === 'settings') {
        settingsBtn.classList.add('ring-2', 'ring-emerald-500', 'text-emerald-600', 'dark:text-emerald-400');
      } else {
        settingsBtn.classList.remove('ring-2', 'ring-emerald-500', 'text-emerald-600', 'dark:text-emerald-400');
      }

      const titles = {
        dashboard: ['MyWallet', 'Ringkasan keuangan cerdas'],
        history: ['Histori Transaksi', 'Catatan keluar, masuk & lampiran struk'],
        analytics: ['Grafik & Analisis', 'Visualisasi arus kas & kategori'],
        budget: ['Anggaran, Rutin & Target', 'Batas 75% tabungan, jadwal rutin & target'],
        settings: ['Pengaturan & Laporan', 'Kelola dompet, CSV & backup']
      };
      document.getElementById('headerTitle').textContent = titles[tab][0];
      document.getElementById('headerSubtitle').textContent = titles[tab][1];

      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (activeTab === 'dashboard') renderDashboard();
      else if (activeTab === 'history') renderHistory();
      else if (activeTab === 'analytics') renderAnalytics();
      else if (activeTab === 'budget') renderBudgetAndGoals();
      else if (activeTab === 'settings') renderSettings();
    }

    // =========================================================================
    // TAB 1: BERANDA (DASHBOARD)
    // =========================================================================
    function setDashboardPeriod(period) {
      dashboardPeriod = period;
      renderDashboard();
    }

    function renderDashboard() {
      const walletBalances = getWalletBalances();
      const totalBalance = Object.values(walletBalances).reduce((acc, val) => acc + val, 0);
      const savingsAlert = getSavingsUsageStatus();

      const periodTxs = filterByPeriod(appState.transactions, dashboardPeriod);
      const totalIncome = periodTxs.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
      const totalExpense = periodTxs.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);

      let savingsRate = 0;
      if (totalIncome > 0) {
        savingsRate = Math.round(((totalIncome - totalExpense) / totalIncome) * 100);
      } else if (totalExpense > 0) {
        savingsRate = -100;
      }
      const clampedRate = Math.max(-100, Math.min(100, savingsRate));
      let rateBadge = { text: 'Belum ada pemasukan', cls: 'bg-white/15 text-emerald-100' };
      if (totalIncome > 0) {
        if (savingsRate >= 30) rateBadge = { text: 'Sangat Sehat', cls: 'bg-emerald-400/25 text-emerald-100' };
        else if (savingsRate >= 10) rateBadge = { text: 'Cukup Baik', cls: 'bg-amber-400/25 text-amber-100' };
        else rateBadge = { text: 'Perlu Hemat', cls: 'bg-rose-400/30 text-rose-100' };
      }

      const periodLabels = {
        today: 'Hari Ini',
        week: 'Minggu Ini',
        month: 'Bulan Ini',
        all: 'Semua Waktu'
      };

      const recentTxs = [...appState.transactions]
        .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id))
        .slice(0, 5);

      const activeRecurringCount = appState.recurring.filter(r => r.active).length;

      const main = document.getElementById('mainContent');
      main.innerHTML = `

        <!-- Warning Alert: Penggunaan Anggaran > 75% dari Tabungan -->
        ${savingsAlert.isExceeded75 ? `
          <section class="bg-rose-50 dark:bg-rose-950/60 border-2 border-rose-500/80 rounded-2xl p-3.5 shadow-sm animate-fade-in">
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-xl bg-rose-600 text-white flex items-center justify-center shrink-0 font-extrabold text-sm">
                !
              </div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2">
                  <h3 class="text-xs font-extrabold text-rose-700 dark:text-rose-300 uppercase tracking-wide">
                    Peringatan Anggaran &gt; 75% Tabungan!
                  </h3>
                  <span class="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-extrabold tabular-nums">
                    ${savingsAlert.effectivePct.toFixed(1)}%
                  </span>
                </div>
                <p class="text-xs text-rose-800 dark:text-rose-200 mt-1 leading-relaxed">
                  Pengeluaran bulan ini (<strong>${formatRupiah(savingsAlert.monthExpense)}</strong>) telah melebihi <strong>75%</strong> dari total tabungan Anda (<strong>${formatRupiah(savingsAlert.totalSavings)}</strong>). Segera rem pengeluaran!
                </p>
              </div>
            </div>
          </section>
        ` : ''}

        <!-- Period Filter Pills -->
        <div class="flex items-center justify-between gap-1.5 bg-white dark:bg-slate-800/80 p-1 rounded-2xl border border-slate-200/70 dark:border-slate-800">
          ${Object.entries(periodLabels).map(([key, label]) => `
            <button onclick="setDashboardPeriod('${key}')" class="flex-1 py-1.5 text-xs font-semibold rounded-xl transition ${dashboardPeriod === key
              ? 'bg-emerald-600 text-white shadow-sm'
              : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'}">
              ${label}
            </button>
          `).join('')}
        </div>

        <!-- Hero Summary Card -->
        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-600 via-teal-600 to-cyan-700 text-white p-5 shadow-xl shadow-emerald-600/20">
          <div class="absolute -right-8 -top-8 w-36 h-36 rounded-full bg-white/10 blur-xl pointer-events-none"></div>
          <div class="absolute -left-8 -bottom-10 w-32 h-32 rounded-full bg-black/10 blur-xl pointer-events-none"></div>

          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-medium text-emerald-100">Total Saldo Semua Dompet</span>
            <button onclick="toggleHideBalance()" aria-label="Sembunyikan Saldo" class="p-1.5 rounded-lg bg-white/15 hover:bg-white/25 transition">
              ${appState.settings.hideBalance ? ICONS.eyeOff : ICONS.eye}
            </button>
          </div>
          <div class="text-2xl sm:text-3xl font-extrabold tabular-nums tracking-tight mb-4">
            ${formatRupiah(totalBalance, true)}
          </div>

          <div class="grid grid-cols-2 gap-2.5 mb-3">
            <div class="bg-white/12 backdrop-blur-xs rounded-2xl p-3 border border-white/10">
              <div class="flex items-center gap-1.5 text-emerald-100 text-[11px] font-medium mb-1">
                <span class="w-5 h-5 rounded-full bg-emerald-400/25 flex items-center justify-center text-emerald-200">↓</span>
                Pemasukan
              </div>
              <p class="text-sm font-bold tabular-nums truncate">${formatRupiah(totalIncome, true)}</p>
            </div>
            <div class="bg-white/12 backdrop-blur-xs rounded-2xl p-3 border border-white/10">
              <div class="flex items-center gap-1.5 text-rose-100 text-[11px] font-medium mb-1">
                <span class="w-5 h-5 rounded-full bg-rose-400/25 flex items-center justify-center text-rose-200">↑</span>
                Pengeluaran
              </div>
              <p class="text-sm font-bold tabular-nums truncate">${formatRupiah(totalExpense, true)}</p>
            </div>
          </div>

          <div class="bg-black/15 rounded-2xl px-3.5 py-2.5 flex items-center justify-between">
            <div>
              <span class="text-[11px] text-emerald-100 block">Rasio Tabungan (${periodLabels[dashboardPeriod]})</span>
              <span class="text-sm font-extrabold tabular-nums">${totalIncome > 0 ? clampedRate + '%' : '0%'}</span>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${rateBadge.cls}">
              ${rateBadge.text}
            </span>
          </div>
        </section>

        <!-- Quick Action Shortcuts (Transfer Tunai <-> Rekening & Pencatatan Berulang) -->
        <section class="grid grid-cols-2 gap-2.5">
          <button onclick="openTransferShortcut()" class="bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-3 flex items-center gap-2.5 text-left hover:border-blue-400 active:scale-[0.98] transition shadow-xs">
            <div class="w-9 h-9 rounded-xl bg-blue-100 dark:bg-blue-950/70 text-blue-600 dark:text-blue-400 flex items-center justify-center shrink-0">
              ${ICONS.transfer}
            </div>
            <div class="min-w-0">
              <p class="text-xs font-bold text-slate-900 dark:text-white truncate">Pindah Saldo</p>
              <p class="text-[10px] text-slate-500 truncate">Tunai ↔ Rekening + Admin</p>
            </div>
          </button>

          <button onclick="switchTab('budget')" class="bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-3 flex items-center gap-2.5 text-left hover:border-emerald-400 active:scale-[0.98] transition shadow-xs">
            <div class="w-9 h-9 rounded-xl bg-emerald-100 dark:bg-emerald-950/70 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
              ${ICONS.repeat}
            </div>
            <div class="min-w-0">
              <p class="text-xs font-bold text-slate-900 dark:text-white truncate">Catat Berulang</p>
              <p class="text-[10px] text-slate-500 truncate">${activeRecurringCount} jadwal aktif</p>
            </div>
          </button>
        </section>

        <!-- Wallets / Accounts Strip -->
        <section>
          <div class="flex items-center justify-between mb-2.5">
            <h2 class="text-sm font-bold text-slate-800 dark:text-white">Dompet & Akun</h2>
            <button onclick="switchTab('settings')" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:underline">
              + Kelola Dompet
            </button>
          </div>
          <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
            ${appState.wallets.map(w => {
              const bal = walletBalances[w.id] || 0;
              return `
                <div class="min-w-[155px] bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-3.5 shrink-0 shadow-xs">
                  <div class="flex items-center justify-between mb-2.5">
                    <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white" style="background-color: ${w.color}">
                      ${getWalletIcon(w.type)}
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                      ${w.type}
                    </span>
                  </div>
                  <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">${w.name}</p>
                  <p class="text-sm font-extrabold tabular-nums text-slate-900 dark:text-white mt-0.5">${formatRupiah(bal, true)}</p>
                </div>
              `;
            }).join('')}
          </div>
        </section>

        <!-- Recent 5 Transactions -->
        <section>
          <div class="flex items-center justify-between mb-2.5">
            <h2 class="text-sm font-bold text-slate-800 dark:text-white">5 Transaksi Terakhir</h2>
            <div class="flex items-center gap-2">
              <button onclick="openTransactionModal()" class="px-2.5 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/70 text-emerald-600 dark:text-emerald-400 text-xs font-bold hover:bg-emerald-100 transition">
                + Tambah
              </button>
              <button onclick="switchTab('history')" class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-emerald-600">
                Semua
              </button>
            </div>
          </div>

          <div class="space-y-2.5">
            ${recentTxs.length ? recentTxs.map(tx => renderTransactionCard(tx, false)).join('') : `
              <div class="bg-white dark:bg-slate-800/60 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-6 text-center">
                <p class="text-sm font-semibold text-slate-600 dark:text-slate-300 mb-1">Belum ada transaksi</p>
                <p class="text-xs text-slate-400 mb-3">Mulai catat pemasukan atau pengeluaran Anda hari ini.</p>
                <button onclick="openTransactionModal()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">+ Tambah Transaksi</button>
              </div>
            `}
          </div>
        </section>
      `;
    }

    // Reusable Transaction Item Component (with Receipt Photo badge, Admin Fee info, Recurring tag)
    function renderTransactionCard(tx, showActions = true) {
      const cat = getCategoryMeta(tx.type === 'transfer' ? 'Transfer' : tx.category);
      const wallet = appState.wallets.find(w => w.id === tx.walletId);
      const toWallet = tx.toWalletId ? appState.wallets.find(w => w.id === tx.toWalletId) : null;
      const adminFee = Number(tx.adminFee) || 0;

      let amountColor = 'text-rose-600 dark:text-rose-400';
      let amountPrefix = '- ';
      if (tx.type === 'income') {
        amountColor = 'text-emerald-600 dark:text-emerald-400';
        amountPrefix = '+ ';
      } else if (tx.type === 'transfer') {
        amountColor = 'text-blue-600 dark:text-blue-400';
        amountPrefix = '⇄ ';
      }

      const walletInfo = tx.type === 'transfer'
        ? `${wallet ? wallet.name : 'Dompet'} → ${toWallet ? toWallet.name : 'Tujuan'}`
        : (wallet ? wallet.name : 'Dompet');

      return `
        <div class="bg-white dark:bg-slate-800/90 border border-slate-200/70 dark:border-slate-800 rounded-2xl p-3.5 flex items-center justify-between gap-3 shadow-xs transition hover:border-slate-300 dark:hover:border-slate-700">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 rounded-xl ${cat.bg} flex items-center justify-center shrink-0">
              ${ICONS[cat.icon]}
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <p class="text-sm font-bold text-slate-900 dark:text-white truncate">
                  ${tx.note ? escapeHtml(tx.note) : (tx.type === 'transfer' ? 'Pemindahan Saldo' : tx.category)}
                </p>
                ${tx.isRecurringAuto ? `<span class="px-1.5 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-[9px] font-bold shrink-0">Rutin</span>` : ''}
              </div>
              <div class="flex items-center gap-1.5 text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 truncate">
                <span class="font-medium">${tx.type === 'transfer' ? 'Transfer' : tx.category}</span>
                <span>•</span>
                <span class="truncate">${escapeHtml(walletInfo)}</span>
              </div>
              ${tx.type === 'transfer' && adminFee > 0 ? `
                <p class="text-[10px] font-semibold text-amber-600 dark:text-amber-400 mt-0.5 tabular-nums">
                  Admin ${formatRupiah(adminFee)} • Total keluar ${formatRupiah(Number(tx.amount) + adminFee)}
                </p>
              ` : ''}
              <div class="flex items-center gap-2 mt-1">
                <span class="text-[10px] text-slate-400 dark:text-slate-500">${formatDateIndo(tx.date)}</span>
                ${tx.photo ? `
                  <button onclick="openPhotoViewer('${tx.id}')" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-blue-50 dark:bg-blue-950/70 text-blue-600 dark:text-blue-400 text-[10px] font-bold hover:bg-blue-100 transition">
                    ${ICONS.camera}
                    <span>Lihat Struk</span>
                  </button>
                ` : ''}
              </div>
            </div>
          </div>

          <div class="flex flex-col items-end shrink-0">
            <span class="text-sm font-extrabold tabular-nums ${amountColor}">
              ${amountPrefix}${formatRupiah(tx.amount, true)}
            </span>
            ${showActions ? `
              <div class="flex items-center gap-1 mt-1.5">
                <button onclick="openTransactionModal('${tx.id}')" aria-label="Edit" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-[10px] font-bold hover:bg-blue-50 hover:text-blue-600">
                  Edit
                </button>
                <button onclick="confirmDeleteTransaction('${tx.id}')" aria-label="Hapus" class="px-2 py-1 rounded-lg bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 text-[10px] font-bold hover:bg-rose-100">
                  Hapus
                </button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // TAB 2: HISTORI TRANSAKSI LENGKAP
    // =========================================================================
    function renderHistory() {
      const filtered = appState.transactions
        .filter(tx => {
          if (historyFilters.type !== 'all' && tx.type !== historyFilters.type) return false;
          if (historyFilters.category !== 'all' && tx.category !== historyFilters.category) return false;
          if (historyFilters.wallet !== 'all' && tx.walletId !== historyFilters.wallet && tx.toWalletId !== historyFilters.wallet) return false;
          if (historyFilters.search.trim() !== '') {
            const q = historyFilters.search.toLowerCase();
            const matchNote = (tx.note || '').toLowerCase().includes(q);
            const matchCat = (tx.category || '').toLowerCase().includes(q);
            const matchAmt = String(tx.amount).includes(q);
            if (!matchNote && !matchCat && !matchAmt) return false;
          }
          return true;
        })
        .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

      const sumIn = filtered.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount), 0);
      const sumOut = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0);

      const main = document.getElementById('mainContent');
      main.innerHTML = `
        <div class="space-y-2.5 bg-white dark:bg-slate-800/90 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-800">
          <div class="relative">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
            </svg>
            <input type="text" id="historySearchInput" value="${escapeHtml(historyFilters.search)}" oninput="updateHistoryFilter('search', this.value)"
              placeholder="Cari catatan, kategori, nominal..."
              class="w-full pl-9 pr-4 py-2.5 text-xs font-medium bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-900 dark:text-white" />
          </div>

          <div class="grid grid-cols-4 gap-1.5">
            ${[
              ['all', 'Semua'],
              ['income', 'Masuk'],
              ['expense', 'Keluar'],
              ['transfer', 'Transfer']
            ].map(([val, lbl]) => `
              <button onclick="updateHistoryFilter('type', '${val}')" class="py-1.5 text-[11px] font-bold rounded-lg transition ${historyFilters.type === val
                ? 'bg-emerald-600 text-white'
                : 'bg-slate-100 dark:bg-slate-700/70 text-slate-600 dark:text-slate-300'}">
                ${lbl}
              </button>
            `).join('')}
          </div>

          <div class="grid grid-cols-2 gap-2">
            <select onchange="updateHistoryFilter('category', this.value)" class="px-2.5 py-2 text-xs font-medium bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-200">
              <option value="all" ${historyFilters.category === 'all' ? 'selected' : ''}>Semua Kategori</option>
              ${CATEGORIES.map(c => `<option value="${c.name}" ${historyFilters.category === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
              <option value="Transfer" ${historyFilters.category === 'Transfer' ? 'selected' : ''}>Transfer</option>
            </select>

            <select onchange="updateHistoryFilter('wallet', this.value)" class="px-2.5 py-2 text-xs font-medium bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-200">
              <option value="all" ${historyFilters.wallet === 'all' ? 'selected' : ''}>Semua Dompet</option>
              ${appState.wallets.map(w => `<option value="${escapeHtml(w.id)}" ${historyFilters.wallet === w.id ? 'selected' : ''}>${escapeHtml(w.name)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs px-1">
          <span class="font-semibold text-slate-500 dark:text-slate-400">${filtered.length} transaksi ditemukan</span>
          <div class="flex items-center gap-3 tabular-nums font-bold">
            <span class="text-emerald-600 dark:text-emerald-400">+${formatShortRupiah(sumIn)}</span>
            <span class="text-rose-600 dark:text-rose-400">-${formatShortRupiah(sumOut)}</span>
          </div>
        </div>

        <div id="historyListContainer" class="space-y-2.5">
          ${filtered.length ? filtered.slice(0, historyLimit).map(tx => renderTransactionCard(tx, true)).join('') + (filtered.length > historyLimit ? `<button onclick="showMoreHistory()" class="w-full py-3 rounded-xl bg-slate-200 dark:bg-slate-700 text-xs font-bold">Tampilkan lebih banyak (${filtered.length - historyLimit} lagi)</button>` : '') : `
            <div class="bg-white dark:bg-slate-800/60 border border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-8 text-center">
              <p class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-1">Tidak ada transaksi cocok</p>
              <p class="text-xs text-slate-400 mb-3">Coba ubah kata kunci pencarian atau reset filter.</p>
              <button onclick="resetHistoryFilters()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-xs font-bold">Reset Filter</button>
            </div>
          `}
        </div>
      `;
    }

    let historySearchTimer = null;
    function updateHistoryFilter(key, value) {
      historyFilters[key] = value;
      historyLimit = 100;
      if (key === 'search') {
        clearTimeout(historySearchTimer);
        historySearchTimer = setTimeout(() => {
          renderHistory();
          const input = document.getElementById('historySearchInput');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        }, 250);
        return;
      }
      renderHistory();
    }

    function showMoreHistory() {
      historyLimit += 100;
      const y = window.scrollY;
      renderHistory();
      window.scrollTo(0, y);
    }

    function resetHistoryFilters() {
      historyFilters = { search: '', type: 'all', category: 'all', wallet: 'all' };
      historyLimit = 100;
      renderHistory();
    }

    // =========================================================================
    // TAB 3: GRAFIK & ANALISIS (CHART.JS)
    // =========================================================================
    function setAnalyticsPeriod(p) {
      analyticsPeriod = p;
      renderAnalytics();
    }

    function setAnalyticsChartType(type) {
      analyticsChartType = type;
      renderAnalytics();
    }

    function renderAnalytics() {
      const txs = filterByPeriod(appState.transactions, analyticsPeriod);

    function renderChartInstances(txs, sortedCategories) {
      if (typeof Chart === 'undefined') {
        document.querySelectorAll('#mainContent canvas').forEach(cv => {
          const p = cv.parentElement;
          if (p) p.innerHTML = '<p class="text-xs text-slate-500 text-center py-10">Grafik belum bisa dimuat (library Chart.js belum tersedia offline).</p>';
        });
        if (!window.__chartRetry) {
          window.__chartRetry = setTimeout(() => {
            window.__chartRetry = null;
            if (typeof Chart !== 'undefined' && activeTab === 'analytics') renderAnalytics();
          }, 2500);
        }
        return;
      }
      if (chartInstances.flow) chartInstances.flow.destroy();
      if (chartInstances.category) chartInstances.category.destroy();

      const isDark = appState.settings.darkMode;
      const textColor = isDark ? '#94a3b8' : '#64748b';
      const gridColor = isDark ? 'rgba(148, 163, 184, 0.1)' : 'rgba(100, 116, 139, 0.1)';

      const buckets = {};
      txs.forEach(t => {
        if (t.type === 'transfer') return;
        const key = analyticsPeriod === 'month' ? t.date.slice(5) : t.date.slice(0, 7);
        if (!buckets[key]) buckets[key] = { income: 0, expense: 0 };
        if (t.type === 'income') buckets[key].income += Number(t.amount);
        if (t.type === 'expense') buckets[key].expense += Number(t.amount);
      });

      const sortedKeys = Object.keys(buckets).sort();
      const labels = sortedKeys.length ? sortedKeys : [trStr('Belum ada data')];
      const incomeData = sortedKeys.length ? sortedKeys.map(k => buckets[k].income) : [0];
      const expenseData = sortedKeys.length ? sortedKeys.map(k => buckets[k].expense) : [0];

      const flowCtx = document.getElementById('cashflowChart');
      if (flowCtx) {
        chartInstances.flow = new Chart(flowCtx, {
          type: analyticsChartType,
          data: {
            labels,
            datasets: [
              {
                label: trStr('Pemasukan'),
                data: incomeData,
                backgroundColor: analyticsChartType === 'bar' ? '#10b981' : 'rgba(16, 185, 129, 0.18)',
                borderColor: '#10b981',
                borderWidth: 2.5,
                borderRadius: 6,
                tension: 0.35,
                fill: analyticsChartType === 'line'
              },
              {
                label: trStr('Pengeluaran'),
                data: expenseData,
                backgroundColor: analyticsChartType === 'bar' ? '#f43f5e' : 'rgba(244, 63, 94, 0.18)',
                borderColor: '#f43f5e',
                borderWidth: 2.5,
                borderRadius: 6,
                tension: 0.35,
                fill: analyticsChartType === 'line'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { color: textColor, boxWidth: 10, usePointStyle: true, font: { size: 11, weight: '600' } }
              },
              tooltip: {
                callbacks: {
                  label: ctx => `${ctx.dataset.label}: ${formatRupiah(ctx.raw)}`
                }
              }
            },
            scales: {
              x: {
                ticks: { color: textColor, font: { size: 10 } },
                grid: { display: false }
              },
              y: {
                ticks: {
                  color: textColor,
                  font: { size: 10 },
                  callback: val => formatShortRupiah(val)
                },
                grid: { color: gridColor }
              }
            }
          }
        });
      }

      const catCtx = document.getElementById('categoryDoughnutChart');
      if (catCtx && sortedCategories.length) {
        chartInstances.category = new Chart(catCtx, {
          type: 'doughnut',
          data: {
            labels: sortedCategories.map(c => trStr(c[0])),
            datasets: [{
              data: sortedCategories.map(c => c[1]),
              backgroundColor: sortedCategories.map(c => getCategoryMeta(c[0]).color),
              borderWidth: 2,
              borderColor: isDark ? '#1e293b' : '#ffffff',
              hoverOffset: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '66%',
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => ` ${ctx.label}: ${formatRupiah(ctx.raw)}`
                }
              }
            }
          }
        });
      }
    }

    function openTransferShortcut() {
      openTransactionModal();
      setTxType('transfer', false);
      const cashWallet = appState.wallets.find(w => w.type === 'Tunai');
      const bankWallet = appState.wallets.find(w => w.type === 'Bank');
      if (cashWallet && bankWallet) {
        document.getElementById('txWallet').value = cashWallet.id;
        document.getElementById('txToWallet').value = bankWallet.id;
        onTransferWalletChange();
      }
    }

    function openTransactionModal(editTxId = null) {
      const modal = document.getElementById('txModal');
      const title = document.getElementById('txModalTitle');
      const txIdInput = document.getElementById('txId');
      const amountInput = document.getElementById('txAmount');
      const adminInput = document.getElementById('txAdminFee');
      const dateInput = document.getElementById('txDate');
      const noteInput = document.getElementById('txNote');
      const recCheck = document.getElementById('txIsRecurring');
      const recFreqWrap = document.getElementById('txRecurringFreqWrapper');

      const walletSelect = document.getElementById('txWallet');
      const toWalletSelect = document.getElementById('txToWallet');
      const walletOptionsHtml = appState.wallets.map(w => `<option value="${w.id}">${escapeHtml(w.name)} (${w.type})</option>`).join('');
      walletSelect.innerHTML = walletOptionsHtml;
      toWalletSelect.innerHTML = walletOptionsHtml;
      if (appState.wallets.length > 1) {
        toWalletSelect.selectedIndex = 1;
      }

      recCheck.checked = false;
      recFreqWrap.classList.add('hidden');
      document.getElementById('txPhotoInput').value = '';

      if (editTxId) {
        const tx = appState.transactions.find(t => t.id === editTxId);
        if (!tx) return;
        title.textContent = 'Edit Transaksi';
        txIdInput.value = tx.id;
        modalTxType = tx.type;
        modalSelectedCategory = tx.category || 'Makanan & Minuman';
        amountInput.value = new Intl.NumberFormat('id-ID').format(tx.amount);
        adminInput.value = tx.adminFee ? new Intl.NumberFormat('id-ID').format(tx.adminFee) : '0';
        walletSelect.value = tx.walletId;
        if (tx.toWalletId) toWalletSelect.value = tx.toWalletId;
        dateInput.value = tx.date;
        noteInput.value = tx.note || '';
        modalPhotoDataUrl = tx.photo || null;
        document.getElementById('txRecurringOptionBox').classList.add('hidden');
      } else {
        title.textContent = 'Tambah Transaksi';
        txIdInput.value = '';
        modalTxType = 'expense';
        modalSelectedCategory = 'Makanan & Minuman';
        amountInput.value = '';
        adminInput.value = '0';
        dateInput.value = getRelativeDate(0);
        noteInput.value = '';
        modalPhotoDataUrl = null;
        document.getElementById('txRecurringOptionBox').classList.remove('hidden');
      }

      syncPhotoPreviewUI();
      setTxType(modalTxType, Boolean(editTxId));
      modal.classList.remove('hidden');
    }

      document.getElementById('txModal').classList.add('hidden');

    function setTxType(type, preserveCategory = false) {
      modalTxType = type;

      const btnExp = document.getElementById('typeBtnExpense');
      const btnInc = document.getElementById('typeBtnIncome');
      const btnTrf = document.getElementById('typeBtnTransfer');

      [btnExp, btnInc, btnTrf].forEach(b => {
        b.className = 'py-2.5 text-xs font-bold rounded-xl transition text-slate-500 dark:text-slate-400';
      });

      if (type === 'expense') {
        btnExp.className = 'py-2.5 text-xs font-bold rounded-xl transition bg-rose-600 text-white shadow-xs';
        if (!preserveCategory) modalSelectedCategory = 'Makanan & Minuman';
      } else if (type === 'income') {
        btnInc.className = 'py-2.5 text-xs font-bold rounded-xl transition bg-emerald-600 text-white shadow-xs';
        if (!preserveCategory) modalSelectedCategory = 'Gaji/Uang Saku';
      } else {
        btnTrf.className = 'py-2.5 text-xs font-bold rounded-xl transition bg-blue-600 text-white shadow-xs';
      }

      const catWrapper = document.getElementById('txCategoryWrapper');
      const toWalletWrapper = document.getElementById('txToWalletWrapper');
      const adminWrapper = document.getElementById('txAdminFeeWrapper');
      const recOptionBox = document.getElementById('txRecurringOptionBox');
      const walletLabel = document.getElementById('txWalletLabel');

      if (type === 'transfer') {
        catWrapper.classList.add('hidden');
        toWalletWrapper.classList.remove('hidden');
        adminWrapper.classList.remove('hidden');
        recOptionBox.classList.add('hidden');
        walletLabel.textContent = 'Dari Dompet Asal';
        if (!preserveCategory) onTransferWalletChange();
        updateTransferBreakdown();
      } else {
        catWrapper.classList.remove('hidden');
        toWalletWrapper.classList.add('hidden');
        adminWrapper.classList.add('hidden');
        if (!document.getElementById('txId').value) recOptionBox.classList.remove('hidden');
        walletLabel.textContent = 'Pilih Dompet / Akun';
        renderCategorySelectorGrid();
      }
    }

    function onTransferWalletChange() {
      if (modalTxType !== 'transfer') return;
      const fromId = document.getElementById('txWallet').value;
      const toId = document.getElementById('txToWallet').value;
      const fromW = appState.wallets.find(w => w.id === fromId);
      const toW = appState.wallets.find(w => w.id === toId);
      const adminInput = document.getElementById('txAdminFee');

      // Auto-suggest Rp 2.000 admin fee when moving Tunai -> Rekening (Bank)
      if (fromW && toW && fromW.type === 'Tunai' && toW.type === 'Bank') {
        if (parseCurrencyValue(adminInput.value) === 0) {
          adminInput.value = '2.000';
        }
      }
      updateTransferBreakdown();
    }

    function updateTransferBreakdown() {
      if (modalTxType !== 'transfer') return;
      const amount = parseCurrencyValue(document.getElementById('txAmount').value);
      const admin = parseCurrencyValue(document.getElementById('txAdminFee').value);
      const fromId = document.getElementById('txWallet').value;
      const toId = document.getElementById('txToWallet').value;
      const fromW = appState.wallets.find(w => w.id === fromId);
      const toW = appState.wallets.find(w => w.id === toId);

      const fromName = fromW ? fromW.name : 'Dompet Asal';
      const toName = toW ? toW.name : 'Dompet Tujuan';
      const totalDeducted = amount + admin;

      document.getElementById('transferBreakdownBox').innerHTML = `
        <div class="flex justify-between">
          <span>Total dipotong dari <strong>${escapeHtml(fromName)}</strong>:</span>
          <strong class="tabular-nums text-rose-600 dark:text-rose-400">${formatRupiah(totalDeducted)}</strong>
        </div>
        <div class="flex justify-between">
          <span>Biaya Admin:</span>
          <span class="tabular-nums font-semibold">${formatRupiah(admin)}</span>
        </div>
        <div class="flex justify-between pt-1 border-t border-blue-200/70 dark:border-blue-800/70">
          <span>Saldo masuk ke <strong>${escapeHtml(toName)}</strong>:</span>
          <strong class="tabular-nums text-emerald-600 dark:text-emerald-400">${formatRupiah(amount)}</strong>
        </div>
      `;
    }

    // Photo Attachment Compression & Preview
    function handleTxPhotoSelect(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          modalPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.65);
          syncPhotoPreviewUI();
          showToast('Foto struk berhasil dilampirkan');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function formatCurrencyInput(input) {
      const digits = input.value.replace(/\D/g, '');
      input.value = digits ? new Intl.NumberFormat('id-ID').format(Number(digits)) : '';
    }

    function parseCurrencyValue(formattedStr) {
      return Number(String(formattedStr).replace(/\D/g, '')) || 0;
    }

    function addQuickAmount(addVal) {
      const input = document.getElementById('txAmount');
      const current = parseCurrencyValue(input.value);
      input.value = new Intl.NumberFormat('id-ID').format(current + addVal);
      updateTransferBreakdown();
    }

    function saveTransaction(e) {
      e.preventDefault();
      const id = document.getElementById('txId').value;
      const amount = parseCurrencyValue(document.getElementById('txAmount').value);
      const adminFee = modalTxType === 'transfer' ? parseCurrencyValue(document.getElementById('txAdminFee').value) : 0;
      const walletId = document.getElementById('txWallet').value;
      const toWalletId = document.getElementById('txToWallet').value;
      const date = document.getElementById('txDate').value;
      const note = document.getElementById('txNote').value.trim();

      if (amount <= 0) {
        showToast('Masukkan nominal lebih dari Rp 0', 'error');
        return;
      }

      if (modalTxType === 'transfer' && walletId === toWalletId) {
        showToast('Dompet asal dan tujuan tidak boleh sama', 'error');
        return;
      }

      const txPayload = {
        id: id || 'tx_' + Date.now(),
        type: modalTxType,
        amount,
        category: modalTxType === 'transfer' ? 'Transfer' : modalSelectedCategory,
        walletId,
        toWalletId: modalTxType === 'transfer' ? toWalletId : null,
        adminFee,
        photo: modalPhotoDataUrl,
        date,
        note
      };

      if (id) {
        const idx = appState.transactions.findIndex(t => t.id === id);
        if (idx !== -1) appState.transactions[idx] = Object.assign({}, appState.transactions[idx], txPayload);
        showToast('Transaksi berhasil diperbarui');
      } else {
        appState.transactions.unshift(txPayload);

        // If user checked "Jadikan Pencatatan Berulang"
        const isRec = document.getElementById('txIsRecurring').checked;
        if (isRec && modalTxType !== 'transfer') {
          const freq = document.getElementById('txRecurringFreq').value;
          const nextDate = freq === 'daily'
            ? addDaysToDateStr(date, 1)
            : (freq === 'weekly' ? addDaysToDateStr(date, 7) : addMonthsToDateStr(date, 1));
          appState.recurring.push({
            id: 'rec_' + Date.now(),
            type: modalTxType,
            amount,
            category: modalSelectedCategory,
            walletId,
            note: note || modalSelectedCategory,
            frequency: freq,
            nextDate,
            anchorDay: Number(date.slice(8, 10)),
            active: true
          });
          showToast('Transaksi & jadwal berulang disimpan!');
        } else {
          showToast('Transaksi berhasil ditambahkan');
        }
      }

      saveState();
      closeTransactionModal();
      renderCurrentTab();

      // Check 75% Savings Warning immediately after saving an expense
      if (modalTxType === 'expense') {
        const alertStatus = getSavingsUsageStatus();
        if (alertStatus.isExceeded75) {
          setTimeout(() => {
            showToast(`Peringatan: Anggaran sudah ${alertStatus.effectivePct.toFixed(0)}% (>75%) dari tabungan!`, 'error');
          }, 600);
        }
      }
    }

          saveState();
          renderCurrentTab();
          showToast('Transaksi dihapus');
        }
      );
    }

    function saveRecurringRule(e) {
      e.preventDefault();
      const note = document.getElementById('recNoteInput').value.trim();
      const amount = parseCurrencyValue(document.getElementById('recAmountInput').value);
      const frequency = document.getElementById('recFreqInput').value;
      const category = document.getElementById('recCatInput').value;
      const walletId = document.getElementById('recWalletInput').value;
      const startDate = document.getElementById('recStartInput').value;

      if (!note || amount <= 0) {
        showToast('Lengkapi nama dan nominal', 'error');
        return;
      }

      const catObj = getCategoryMeta(category);
      const type = catObj.type === 'income' ? 'income' : 'expense';

      appState.recurring.push({
        id: 'rec_' + Date.now(),
        type,
        amount,
        category,
        walletId,
        note,
        frequency,
        nextDate: startDate,
        active: true
      });

      processRecurringTransactions();
      saveState();

    function handleGoalImageSelect(input) {
      const f = input.files && input.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, 640 / Math.max(img.width, img.height));
          const w = Math.round(img.width * k), h = Math.round(img.height * k);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          goalImageData = c.toDataURL('image/jpeg', 0.7);
          syncGoalImagePreview();
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(f);
    }

    function exportTransactionsCSV() {
      if (!appState.transactions.length) {

        return;
      }
      const headers = ['Tanggal', 'Tipe', 'Kategori', 'Dompet', 'Dompet Tujuan', 'Nominal (Rp)', 'Biaya Admin (Rp)', 'Catatan'];
      const rows = appState.transactions.map(tx => {
        const w = appState.wallets.find(x => x.id === tx.walletId);
        const tw = tx.toWalletId ? appState.wallets.find(x => x.id === tx.toWalletId) : null;
        const typeLabel = tx.type === 'income' ? 'Pemasukan' : (tx.type === 'expense' ? 'Pengeluaran' : 'Transfer');
        return [
          tx.date,
          typeLabel,
          `"${(tx.category || '').replace(/"/g, '""')}"`,
          `"${(w ? w.name : '-').replace(/"/g, '""')}"`,
          `"${(tw ? tw.name : '-').replace(/"/g, '""')}"`,
          tx.amount,
          tx.adminFee || 0,
          `"${(tx.note || '').replace(/"/g, '""')}"`
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      saveFileSmart(csvContent, `Laporan_MyWallet_${getRelativeDate(0)}.csv`, 'text/csv;charset=utf-8;');
    }

    function backupDataJSON(includePhotos = true) {

        goals: appState.goals.map(g => Object.assign({}, g, { image: null }))

      const jsonStr = JSON.stringify(data, null, includePhotos ? 0 : 2);

    function isAndroidWebView() {
      const ua = navigator.userAgent;
      return /Android/.test(ua) && (/; wv\)/.test(ua) || /Version\/[\d.]+ Chrome/.test(ua));
    }

    // Simpan file dengan beberapa jalur, pilih yang tersedia di perangkat:
    // 1) jembatan native APK  2) Capacitor  3) Web Share (file)  4) unduh biasa  5) salin teks
    async function saveFileSmart(content, filename, mimeType, opts = {}) {
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') {
          window.AndroidBridge.saveFile(filename, content, mimeType);
          showToast('File disimpan: ' + filename);
          return;
        }
      } catch (e) {}

      try {
        const P = window.Capacitor && window.Capacitor.Plugins;
        if (P && P.Filesystem) {
          const res = await P.Filesystem.writeFile({ path: filename, data: content, directory: 'DOCUMENTS', encoding: 'utf8' });
          if (P.Share) { try { await P.Share.share({ title: filename, url: res.uri }); } catch (e) {} }
          showToast('File tersimpan di Documents/' + filename);
          return;
        }
      } catch (e) {}

      try {
        const file = new File([content], filename, { type: mimeType.split(';')[0] });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          showToast('Pilih tujuan penyimpanan file');
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }

      if (!isAndroidWebView()) {
        downloadFile(content, filename, mimeType);
        showToast('File ' + filename + ' berhasil diunduh');
        return;
      }

      openTextExportModal(content, filename, !!opts.isBackup);
    }

    function openTextExportModal(content, filename, isBackup) {
      const sizeKb = Math.round(content.length / 1024);
      openGenericModal('Simpan ' + (isBackup ? 'Backup' : 'Laporan'), `
        <div class="space-y-3">
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
            HP ini belum mengizinkan unduh file langsung. Salin isinya lalu tempel & simpan di <strong>Catatan</strong>, WhatsApp (chat sendiri), atau Google Keep.
            ${isBackup ? 'Untuk memulihkan, pakai tombol <strong>Restore dari Teks</strong> di Pengaturan.' : 'Simpan teksnya sebagai file <strong>' + escapeHtml(filename) + '</strong> kalau mau dibuka di Excel.'}
          </p>
          <textarea id="exportTextArea" readonly rows="6" class="w-full p-3 text-[11px] font-mono bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-200"></textarea>
          <p class="text-[11px] text-slate-400">Ukuran: ${sizeKb} KB</p>
          <div class="grid grid-cols-1 gap-2">
            <button onclick="copyExportText()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">Salin ke Clipboard</button>
            ${navigator.share ? `<button onclick="shareExportText()" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold">Bagikan sebagai Teks</button>` : ''}
            ${isBackup && sizeKb > 800 ? `<button onclick="closeGenericModal(); backupDataJSON(false)" class="w-full py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold">Ukuran terlalu besar? Backup tanpa foto struk</button>` : ''}
          </div>
        </div>
      `);
      const ta = document.getElementById('exportTextArea');
      if (ta) ta.value = content;
    }

    function copyExportText() {
      const ta = document.getElementById('exportTextArea');
      if (!ta) return;
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      if (ok) {
        showToast('Tersalin! Tempel & simpan di Catatan / WhatsApp');
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(
          () => showToast('Tersalin! Tempel & simpan di Catatan / WhatsApp'),
          () => showToast('Gagal menyalin. Tekan lama teks lalu pilih Salin', 'error')
        );
      } else {
        showToast('Gagal menyalin. Tekan lama teks lalu pilih Salin', 'error');
      }
    }

    function shareExportText() {
      const ta = document.getElementById('exportTextArea');
      if (!ta || !navigator.share) return;
      navigator.share({ title: 'MyWallet', text: ta.value }).catch(() => {});
    }

    function openRestorePasteModal() {
      openGenericModal('Restore dari Teks', `
        <div class="space-y-3">
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">Tempel isi backup (teks JSON) yang tadi disalin, lalu tekan Pulihkan. Data saat ini akan diganti.</p>
          <textarea id="restoreTextArea" rows="7" placeholder="Tempel backup di sini..." class="w-full p-3 text-[11px] font-mono bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-200"></textarea>

    function pasteFromClipboardToRestore() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(t => { document.getElementById('restoreTextArea').value = t; }, () => showToast('Izin clipboard ditolak, tempel manual di kotak', 'error'));
      } else {
        showToast('Tekan lama di kotak lalu pilih Tempel', 'error');
      }
    }

    function restoreFromPastedText() {
      const text = (document.getElementById('restoreTextArea').value || '').trim();
      if (!text) { showToast('Kotak masih kosong', 'error'); return; }
      closeGenericModal();
      applyRestoreFromText(text);
    }

    function restoreDataJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) { applyRestoreFromText(e.target.result); };
      reader.readAsText(file);
      event.target.value = '';
    }

    function applyRestoreFromText(text) {
      openConfirmModal('Pulihkan dari Backup?', 'Data saat ini akan diganti dengan isi backup. Salinan data lama disimpan otomatis sebagai cadangan darurat.', () => {
        (function() {
        try {
          const parsed = JSON.parse(text);
          if (!parsed || !Array.isArray(parsed.transactions) || !Array.isArray(parsed.wallets) || !parsed.wallets.length) {
            throw new Error('Format file tidak valid');
          }
          try { localStorage.setItem(STORAGE_KEY + '_prerestore', JSON.stringify(appState)); } catch (_) {}
          appState = {
            settings: Object.assign({ darkMode: false, hideBalance: false }, parsed.settings || {}),
            wallets: parsed.wallets,
            transactions: parsed.transactions,
            recurring: Array.isArray(parsed.recurring) ? parsed.recurring : [],
            budgets: Array.isArray(parsed.budgets) ? parsed.budgets : [],
            goals: Array.isArray(parsed.goals) ? parsed.goals : []
          };
          saveState();
          applyTheme();
          renderCurrentTab();
          showToast('Data berhasil dipulihkan dari backup!');
        } catch (err) {
          showToast('File JSON tidak valid atau rusak', 'error');
        }
        })();
      });
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    let toastTimer = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const text = document.getElementById('toastText');

      icon.innerHTML = type === 'error'
        ? `<span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>`
        : `<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>`;
      text.textContent = message;

      toast.classList.remove('opacity-0', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2800);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    const I18N_RULES = [
      [/^(\d+) transaksi ditemukan$/, '$1 transactions found'],
      [/^(\d+) transaksi keluar$/, '$1 expense transactions'],
      [/^(\d+) jadwal aktif$/, '$1 active schedule(s)'],
      [/^Aman \((\d+)%\)$/, 'Safe ($1%)'],
      [/^dari Rp (.+)$/, 'of Rp $1'],
      [/^Tambah Dana: (.+)$/, 'Add Funds: $1'],
      [/^Berikutnya: (.+)$/, 'Next: $1'],
      [/^Peringatan: Anggaran sudah (\d+)% \(>75%\) dari tabungan!$/, 'Warning: budget already at $1% (>75%) of savings!'],
      [/^(\d+) pencatatan berulang otomatis ditambahkan$/, '$1 recurring entries added automatically'],

      [/^File disimpan: (.+)$/, 'File saved: $1'],
      [/^File tersimpan di (.+)$/, 'File saved in $1']
    ];
    function getLang() {
      return (typeof appState !== 'undefined' && appState.settings && appState.settings.language) || 'id';
    }
    function trStr(s) {
      if (getLang() !== 'en' || !s) return s;
      const t = s.trim();
      if (!t) return s;
      let out = I18N_EN[t];
      if (out === undefined) {
        const m = t.match(/^(Rasio Tabungan) \((.+)\)$/);
        if (m) out = I18N_EN[m[1]] + ' (' + trStr(m[2]) + ')';
        else if (t.indexOf(' \u2022 ') > -1) out = t.split(' \u2022 ').map(trStr).join(' \u2022 ');
        else {
          for (const [re, rp] of I18N_RULES) { if (re.test(t)) { out = t.replace(re, rp); break; } }
        }
      }
      if (out === undefined || out === t) return s;
      return s.replace(t, () => out);
    }
    function translateTree(root) {
      if (getLang() !== 'en' || !root) return;
      if (root.nodeType === 3) {
        const p = root.parentElement;
        if (p && /^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName)) return;
        const v = trStr(root.nodeValue);
        if (v !== root.nodeValue) root.nodeValue = v;
        return;
      }
      if (root.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(root.tagName)) return;
      const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      let n; const nodes = [];
      while ((n = w.nextNode())) nodes.push(n);
      nodes.forEach(translateTree);
      const els = root.querySelectorAll ? [root, ...root.querySelectorAll('[placeholder],[aria-label],[title]')] : [];
      els.forEach(el => ['placeholder', 'aria-label', 'title'].forEach(a => {
        const v = el.getAttribute && el.getAttribute(a);
        if (v) { const t = trStr(v); if (t !== v) el.setAttribute(a, t); }
      }));
    }
    function initI18n() {
      document.documentElement.lang = getLang();
      if (getLang() !== 'en') return;
      document.title = 'MyWallet \u2014 Personal Finance Tracker';
      translateTree(document.body);
      new MutationObserver(muts => {
        muts.forEach(m => {
          if (m.type === 'characterData') translateTree(m.target);
          else m.addedNodes.forEach(translateTree);
        });
      }).observe(document.body, { childList: true, subtree: true, characterData: true });
    }
    function setLanguage(lang) {
      if (lang === getLang()) return;
      appState.settings.language = lang;
      saveState();
      location.reload();
    }

    // Initialize Application on Load
    window.addEventListener('DOMContentLoaded', () => {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      try {
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        }
      } catch (e) {}
      initI18n();
      applyTheme();
      processRecurringTransactions();
      switchTab('dashboard');
    });
